---
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML files
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils
          find . -name "*.xml" -not -path "./config/*" -exec xmllint --noout {} \;

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML files
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          yamllint --config-file .yamllint .github/workflows/ docker-compose*.yml
